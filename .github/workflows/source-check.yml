name: Check MilkSU Source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check MilkSU build script syntax
        shell: bash
        run: |
          for script in tools/build-*.sh tools/bootstrap-*.sh tools/test-kpatch-host.sh; do
            bash -n "$script"
          done
      - name: Check source packaging and publication inputs
        run: |
          python3 -m unittest discover -s tools -p test_package_release.py -q
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -q
          python3 -m unittest discover -s tools -p test_root_policy_acceptance.py -q
          python3 -m unittest discover -s vendor/kpatch-next/kpms/milksu-test -p test_accept_device.py -q
          python3 tools/audit-public-source.py
